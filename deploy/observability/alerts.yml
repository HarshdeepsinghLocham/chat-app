groups:
  - name: semantask-slo
    rules:
      - alert: OutboxBacklogHigh
        expr: sum(outbox_pending) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox backlog is high
          description: Pending/failed outbox events have exceeded 100 for 5 minutes.

      - alert: StuckTasksDetected
        expr: increase(task_stuck_detected_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Stuck tasks detected
          description: One or more stuck task remediations fired over the last 10 minutes.

      - alert: TaskFailureRateHigh
        expr: |
          (
            sum(rate(task_execution_total{outcome="failed"}[15m]))
            /
            clamp_min(
              sum(rate(task_execution_total{outcome=~"succeeded|failed"}[15m])),
              1e-9
            )
          ) > 0.10
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Task failure rate above 10%
          description: Failed task executions exceed 10% of terminal outcomes over 15 minutes.

      - alert: ExecutionEnqueueWhileSuggestOnly
        expr: increase(execution_enqueue_attempted_while_suggest_only_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Execution enqueue attempted while suggest_only
          description: >
            task.execution.requested was attempted (or a leaked outbox event was consumed)
            while SUGGESTION_BLOCK_EXEC is active and effective mode is suggest_only.
            This is a P0 product invariant violation (ADR-005 / Phase 1 suggest-only ingress).

      - alert: AcceptExecutionEnqueueWhileDisabled
        expr: increase(accept_execution_enqueue_attempted_while_disabled_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Accept path attempted execution enqueue while flag disabled
          description: >
            task.execution.requested was attempted with source=suggestion.accept while
            ACCEPT_CREATES_EXECUTION=0. Accept must create coordination Tasks only
            (Phase 2 product invariant).
